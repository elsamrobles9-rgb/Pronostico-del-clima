{% extends 'base.html' %}{% block content %}
<div class="heading"><div><p class="eyebrow">MY ACCOUNT</p><h1>Change my password</h1><p class="muted">Runs <strong>sp_guardar_admin</strong>. Afterwards every session of your account is closed, including this one, and you sign in again.</p></div></div>
<form method="post" class="card"><input type="hidden" name="csrf" value="{{ csrf }}">
<div class="form-grid"><label>Current password<input name="current" type="password" maxlength="128" autocomplete="current-password" required></label><span></span>
<label>New password (12–128 characters)<input name="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required></label><label>Repeat new password<input name="confirm" type="password" minlength="12" maxlength="128" autocomplete="new-password" required></label></div>
<div class="form-actions"><button class="button primary">Change password</button></div></form>
{% endblock %}
