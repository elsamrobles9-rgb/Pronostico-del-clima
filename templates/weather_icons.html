{# Íconos propios del clima (SVG). Sin estilos en línea: los colores están en style.css. #}
{% macro wx(icono, dia=True, cls='wx') %}<svg class="{{ cls }}" viewBox="0 0 64 64" role="img" aria-label="{{ icono }}">
{%- set con_astro = icono in ('despejado', 'nubes-claros', 'lluvia-posible') -%}
{%- set con_nube = icono in ('nubes-claros', 'nublado', 'lluvia-posible', 'lluvia', 'tormenta', 'nieve') -%}
{%- if con_astro -%}
<g{% if con_nube %} transform="translate(-7 -9)"{% endif %}>{% if dia %}<g class="wx-sol"><circle cx="32" cy="32" r="11"/><path class="wx-rayos" d="M32 9v7M32 48v7M9 32h7M48 32h7M15.7 15.7l5 5M43.3 43.3l5 5M15.7 48.3l5-5M43.3 20.7l5-5"/></g>{% else %}<path class="wx-luna" d="M37 13a19 19 0 1 0 15 30A15 15 0 0 1 37 13z"/>{% endif %}</g>
{%- endif -%}
{%- if con_nube -%}
<path class="wx-nube{% if icono in ('nublado', 'lluvia', 'tormenta') %} oscura{% endif %}"{% if icono in ('lluvia-posible', 'lluvia', 'tormenta', 'nieve') %} transform="translate(0 -6)"{% endif %} d="M20 50h26a10 10 0 0 0 0-20 14 14 0 0 0-27-3 9 9 0 0 0 1 23z"/>
{%- endif -%}
{%- if icono in ('lluvia-posible', 'lluvia') -%}<path class="wx-gotas" d="M25 50l-3 7M34 50l-3 7M43 50l-3 7"/>{%- endif -%}
{%- if icono == 'tormenta' -%}<path class="wx-rayo" d="M34 44l-7 10h6l-4 9 11-13h-6l4-6z"/>{%- endif -%}
{%- if icono == 'nieve' -%}<g class="wx-nieve"><circle cx="24" cy="54" r="2.5"/><circle cx="33" cy="58" r="2.5"/><circle cx="42" cy="54" r="2.5"/></g>{%- endif -%}
{%- if icono == 'niebla' -%}<path class="wx-niebla" d="M12 26h40M8 34h48M12 42h40M18 50h28"/>{%- endif -%}
</svg>{% endmacro %}
{% macro flecha(giro) %}<svg class="flecha" viewBox="0 0 24 24" aria-hidden="true"><g transform="rotate({{ giro }} 12 12)"><path d="M12 21V5M7 10l5-5 5 5"/></g></svg>{% endmacro %}
